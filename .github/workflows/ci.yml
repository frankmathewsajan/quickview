name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Backend Tests
        run: |
          cd backend
          uv sync
          uv run python -c "from fastapi.testclient import TestClient; from main import app; client = TestClient(app); assert client.get('/todos').status_code == 200; print('Backend OK')"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build
