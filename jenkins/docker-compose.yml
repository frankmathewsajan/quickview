services:
  jenkins:
    build: .
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - KUBECONFIG=/var/jenkins_home/.kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/var/jenkins_home/.kube:ro
      - ~/.kube:/root/.kube:ro
    restart: unless-stopped

volumes:
  jenkins_home:
